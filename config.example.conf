# Data, not shell code. KEY=value, no shell expansion or quotation marks.
DESKTOP_USER=
# Follow Nemo Grid Compensator's main branch; a full commit can be selected explicitly.
NEMO_REF=main
# Creation uses normal adduser password/Full Name questions through the terminal.
CREATE_USER=yes
PASSWORDLESS_SUDO=no
HYPERVISOR=auto
# Offer physical GPU drivers/firmware. yes authorizes supported installs; no skips.
GRAPHICS_DRIVERS=ask
# Separate consent for a supported Debian proprietary fallback on older NVIDIA GPUs.
NVIDIA_LEGACY=ask
INSTALL_NOTEPADQQ=yes
INSTALL_1PASSWORD=yes
INSTALL_1PASSWORD_CLI=yes
INSTALL_CORE_FONTS=yes
# Absolute paths; empty uses Windows-Cursors.zip / Windows-Fonts.zip in input/.
# Missing archives warn and skip the corresponding customization.
# Supply only artwork you are licensed to use.
CURSOR_ARCHIVE=
FONT_ARCHIVE=
